; Copie este arquivo para backups.ini e ajuste os valores.
; backups.ini está no .gitignore: nunca commite o arquivo real.
; Comentários precisam ficar em linha própria.
;
; As credenciais do FTP NÃO ficam aqui: defina as variáveis de ambiente
; NORTUS_FTP_SERVER, NORTUS_FTP_USER e NORTUS_FTP_PASSWORD.

[DEFAULT]
; Caminho para o gbak (vazio = usa o gbak do PATH)
gbak_path =

; Usuário e senha padrão do Firebird (podem ser sobrescritos por seção)
user = SYSDBA
password = <senha-do-firebird>
max_backups = 7
ftp_sync_interval_minutes = 60

; FTP (o upload só acontece se NORTUS_FTP_SERVER estiver definido)
ftp_port = 21
ftp_remote_dir = /backups
; True = FTPS (TLS explícito). Recomendado.
ftp_secure = True
ftp_timeout = 30
ftp_passive = True


[banco1]
; Nome lógico: vira o nome da pasta e o prefixo dos arquivos
name = empresa1
; Conexão usada pelo gbak (host:caminho)
source = localhost:C:\Dados\empresa1.fdb
; Para sobrescrever usuário/senha só deste banco:
; user = outro_usuario
; password = outra_senha
max_backups = 4
; Horários diários separados por vírgula (HH:MM, 24h)
times = 08:00,12:00,18:00

[banco2]
name = empresa2
source = localhost:C:\Dados\empresa2.fdb
max_backups = 4
times = 22:00
